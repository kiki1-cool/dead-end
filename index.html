<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>The Yellow Maze</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #080807; font-family: Georgia, 'Times New Roman', serif; }
  #game { position: fixed; inset: 0; opacity: 0; transition: opacity 2s ease; }
  #game.ready { opacity: 1; }
  canvas { display: block; }
  #start { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; background: radial-gradient(ellipse at center, rgba(39,35,23,.46), rgba(4,4,3,.98) 78%), #090907; transition: opacity 1.4s ease, visibility 1.4s; }
  #start.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  .title { text-align: center; transform: translateY(-2vh); }
  h1 { margin: 0; color: #d6c995; font: 400 clamp(2.3rem, 7vw, 6.7rem)/.9 Georgia, serif; letter-spacing: .23em; text-indent: .23em; text-shadow: 0 2px 35px rgba(219,196,122,.13); }
  .rule { width: min(270px, 46vw); height: 1px; margin: 2.2rem auto 1.9rem; background: linear-gradient(90deg, transparent, rgba(205,190,138,.55), transparent); }
  #enter { border: 0; padding: 1rem 2.7rem; color: #bdb28d; background: transparent; font: 500 .72rem Arial, sans-serif; letter-spacing: .48em; text-indent: .48em; cursor: pointer; opacity: .8; animation: breathe 3.5s ease-in-out infinite; }
  #enter:hover { color: #efe0aa; opacity: 1; }
  .sub { margin-top: 4.5rem; color: rgba(194,184,148,.34); font: .58rem Arial, sans-serif; letter-spacing: .28em; text-transform: uppercase; }
  @keyframes breathe { 50% { opacity: .36; } }
  #crosshair { position: fixed; z-index: 3; left: 50%; top: 50%; width: 13px; height: 13px; transform: translate(-50%,-50%); opacity: 0; transition: opacity .8s; pointer-events: none; }
  #crosshair.on { opacity: .43; }
  #crosshair:before, #crosshair:after { content: ''; position: absolute; background: #e3d5a5; box-shadow: 0 0 5px rgba(255,235,170,.5); }
  #crosshair:before { width: 1px; height: 13px; left: 6px; top: 0; } #crosshair:after { width: 13px; height: 1px; left: 0; top: 6px; }
  #hint { position: fixed; bottom: 28px; left: 0; width: 100%; z-index: 3; text-align: center; pointer-events: none; color: rgba(219,207,166,.27); font: .58rem Arial,sans-serif; letter-spacing: .22em; opacity: 0; transition: opacity 2s; }
  #hint.on { opacity: 1; }
</style>
</head>
<body>
<div id="game"></div><div id="crosshair"></div><div id="hint">W A S D &nbsp; · &nbsp; MOUSE LOOK &nbsp; · &nbsp; ESC TO RELEASE</div>
<section id="start"><div class="title"><h1>THE YELLOW MAZE</h1><div class="rule"></div><button id="enter">ENTER</button><div class="sub">there is no map for this place</div></div></section>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js';

const game = document.querySelector('#game'), start = document.querySelector('#start'), enter = document.querySelector('#enter'), crosshair = document.querySelector('#crosshair'), hint = document.querySelector('#hint');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x171510);
scene.fog = new THREE.FogExp2(0x423e29, 0.0125);
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, .1, 180);
camera.position.set(0, 1.65, 8); camera.rotation.order = 'YXZ';
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75)); renderer.setSize(innerWidth, innerHeight); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.84;
game.appendChild(renderer.domElement);

const clock = new THREE.Clock(), rng = mulberry32(78231), colliders = [], flickers = [], dust = [];
const world = new THREE.Group(); scene.add(world);
const mats = {};
function mulberry32(a) { return function(){ let t=a+=0x6D2B79F5; t=Math.imul(t^t>>>15,t|1); t^=t+Math.imul(t^t>>>7,t|61); return ((t^t>>>14)>>>0)/4294967296; }; }
function noiseTexture(base, grain, size=256, lines=false) { const c=document.createElement('canvas'); c.width=c.height=size; const x=c.getContext('2d'), b=x.createImageData(size,size); for(let i=0;i<b.data.length;i+=4){ const n=(rng()-.5)*grain; b.data[i]=Math.max(0,Math.min(255,base[0]+n)); b.data[i+1]=Math.max(0,Math.min(255,base[1]+n*.92)); b.data[i+2]=Math.max(0,Math.min(255,base[2]+n*.62)); b.data[i+3]=255; } x.putImageData(b,0,0); if(lines){ x.globalAlpha=.12; x.strokeStyle='#4b4024'; for(let i=0;i<26;i++){ x.beginPath(); x.moveTo(rng()*size,0); x.lineTo(rng()*size,size); x.stroke(); } } const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.colorSpace=THREE.SRGBColorSpace; return t; }
const wallTex=noiseTexture([171,157,93],28,256,true); wallTex.repeat.set(1.2,1.3);
const carpetTex=noiseTexture([104,91,53],24,256,false); carpetTex.repeat.set(5,5);
const ceilingTex=noiseTexture([185,179,151],17,256,true); ceilingTex.repeat.set(2,2);
const darkTex=noiseTexture([47,43,29],14,128,false); darkTex.repeat.set(3,3);
mats.wall=new THREE.MeshStandardMaterial({map:wallTex,roughness:.94, color:0xf0dfa2});
mats.wall2=new THREE.MeshStandardMaterial({map:wallTex,roughness:.97,color:0xd1c27f});
mats.carpet=new THREE.MeshStandardMaterial({map:carpetTex,roughness:1,color:0xb9a45e});
mats.ceiling=new THREE.MeshStandardMaterial({map:ceilingTex,roughness:.88,color:0xd3cfac});
mats.trim=new THREE.MeshStandardMaterial({map:darkTex,roughness:.92,color:0x756b43});
const lightMat=new THREE.MeshStandardMaterial({color:0xfff4c7, emissive:0xffeaa6, emissiveIntensity:3.2, roughness:.25});

function box(name,x,y,z,w,h,d,mat, collide=false, bevel=false){ const g=new THREE.BoxGeometry(w,h,d); const m=new THREE.Mesh(g,mat); m.name=name; m.position.set(x,y,z); if(bevel){ const e=new THREE.EdgesGeometry(g); /* crisp edge detail is intentionally omitted from render */ } m.castShadow=false; m.receiveShadow=true; world.add(m); if(collide) colliders.push({x,z,w,d}); return m; }
function wall(x,z,w,d, variation=0){ box('wall',x,1.55,z,w,3.1,d,variation?mats.wall2:mats.wall,true); box('baseboard',x,.18,z,w,.12,d+.01,mats.trim); }
function floor(x,z,w,d){ box('carpet',x,-.07,z,w,.14,d,mats.carpet); }
function ceiling(x,z,w,d){ box('ceiling',x,3.16,z,w,.12,d,mats.ceiling); }
function fixture(x,z,rot=0){ const body=box('fluorescent fixture',x,3.03,z,.25, .07, 2.5,lightMat); body.rotation.y=rot; const lamp=new THREE.PointLight(0xffeebb,1.9,9,1.65); lamp.position.set(x,2.91,z); lamp.castShadow=false; world.add(lamp); flickers.push({light:lamp, mesh:body, phase:rng()*20, base:1.9}); }

// A deliberately irregular modular maze: broad rooms, offset corridors, and occasional blind turns.
const cells=[
 [-18,-16,14,11],[-3,-16,13,11],[12,-16,16,11],[-18,-3,14,12],[-2,-3,12,12],[11,-3,18,12],[-18,11,14,11],[-3,11,13,11],[12,11,16,11],[-18,24,14,10],[-2,24,12,10],[11,24,18,10]
];
for(const [x,z,w,d] of cells){ floor(x,z,w,d); ceiling(x,z,w,d); }
// Perimeter and partitions, with openings forming the maze.
const segments=[
 [-25,-16, .25,11],[-11,-16,.25,4],[-11,-9,.25,4],[-9,-16, .25,4],[-9,-10,.25,5],[3,-16,.25,4],[3,-10,.25,5],[20,-16,.25,11],
 [-25,-3,.25,12],[-11,-3,.25,5],[-11,5,.25,4],[-9,-3,.25,4],[-9,4,.25,5],[3,-3,.25,4],[3,4,.25,5],[20,-3,.25,12],
 [-25,11,.25,11],[-11,11,.25,4],[-11,18,.25,4],[-9,11,.25,4],[-9,19,.25,3],[3,11,.25,5],[3,20,.25,2],[20,11,.25,11],
 [-25,24,.25,10],[-11,24,.25,4],[-11,31,.25,3],[-9,24,.25,4],[3,24,.25,4],[20,24,.25,10],
 [-18,-21,14,.25],[-3,-21,13,.25],[12,-21,16,.25],[-18,3,5,.25],[-8,3,5,.25],[6,3,7,.25],[15,3,5,.25],[-18,16,6,.25],[-8,16,5,.25],[5,16,7,.25],[15,16,5,.25],[-18,29,14,.25],[-3,29,13,.25],[12,29,16,.25],
 [-18,-11,5,.25],[-8,-11,4,.25],[5,-11,5,.25],[15,-11,5,.25],[-18,7,5,.25],[-7,7,4,.25],[5,7,6,.25],[15,7,5,.25],[-18,20,5,.25],[-7,20,4,.25],[5,20,6,.25],[15,20,5,.25]
];
for(let i=0;i<segments.length;i++){ const [x,z,w,d]=segments[i]; wall(x,z,w,d,i%5===0); }
// Add visual ceiling grid seams, grime bands, and fixtures without overloading the scene.
for(const [x,z,w,d] of cells){ for(let px=x-w/2+3;px<x+w/2-1;px+=5.8) fixture(px,z+(rng()-.5)*2.5,rng()>.5?0:Math.PI/2); }
for(let i=0;i<30;i++){ const x=(rng()*45)-24,z=(rng()*52)-20; const stain=new THREE.Mesh(new THREE.PlaneGeometry(.6+rng()*1.8,.25+rng()*.6),new THREE.MeshBasicMaterial({color:0x77653a,transparent:true,opacity:.045+rng()*.07,depthWrite:false})); stain.rotation.set(-Math.PI/2,0,rng()*Math.PI); stain.position.set(x,.008,z); world.add(stain); }
// Ceiling seams provide scale and imperfect repetition cues.
for(const [x,z,w,d] of cells){ for(let px=x-w/2+2;px<x+w/2;px+=4) box('ceiling seam',px,3.095,z,.018,.012,d,mats.trim); }

const ambient=new THREE.HemisphereLight(0xb7a96f,0x211e14,.46); scene.add(ambient);
const fill=new THREE.DirectionalLight(0xcfc391,.3); fill.position.set(-20,12,20); scene.add(fill);
// A small dust field, softly lit and kept sparse for performance.
const dustGeo=new THREE.BufferGeometry(), dustPos=[]; for(let i=0;i<330;i++){ dustPos.push((rng()*52)-26, .4+rng()*2.4, (rng()*58)-25); } dustGeo.setAttribute('position',new THREE.Float32BufferAttribute(dustPos,3)); const dustMat=new THREE.PointsMaterial({color:0xd8c98c,size:.018,transparent:true,opacity:.19,depthWrite:false}); scene.add(new THREE.Points(dustGeo,dustMat));

let yaw=0,pitch=0, started=false; const keys={}; let lastFoot=0;
addEventListener('keydown',e=>{ keys[e.code]=true; if(e.code==='Escape') document.exitPointerLock?.(); }); addEventListener('keyup',e=>keys[e.code]=false);
addEventListener('mousemove',e=>{ if(document.pointerLockElement===renderer.domElement){ yaw-=e.movementX*.0021; pitch-=e.movementY*.0017; pitch=Math.max(-1.45,Math.min(1.45,pitch)); } });
function begin(){ started=true; start.classList.add('hidden'); game.classList.add('ready'); crosshair.classList.add('on'); hint.classList.add('on'); renderer.domElement.requestPointerLock?.(); }
enter.addEventListener('click',begin); renderer.domElement.addEventListener('click',()=>{ if(started) renderer.domElement.requestPointerLock?.(); });
function blocked(x,z){ const r=.29; return colliders.some(c=>Math.abs(x-c.x)<c.w/2+r && Math.abs(z-c.z)<c.d/2+r); }
function move(dt){ const speed=2.65, v=new THREE.Vector3(); if(keys.KeyW)v.z-=1;if(keys.KeyS)v.z+=1;if(keys.KeyA)v.x-=1;if(keys.KeyD)v.x+=1; if(!v.lengthSq())return false; v.normalize().multiplyScalar(speed*dt); const sin=Math.sin(yaw),cos=Math.cos(yaw); const dx=v.x*cos-v.z*sin,dz=v.x*sin+v.z*cos; if(!blocked(camera.position.x+dx,camera.position.z))camera.position.x+=dx; if(!blocked(camera.position.x,camera.position.z+dz))camera.position.z+=dz; return true; }
function animate(){ requestAnimationFrame(animate); const dt=Math.min(clock.getDelta(),.05), t=clock.elapsedTime; if(started){ const walking=move(dt); camera.rotation.set(pitch,yaw,0); const bob=walking?Math.sin(t*9.3)*.012:0; camera.position.y=1.65+bob; if(walking && t-lastFoot>.62) lastFoot=t; } flickers.forEach(f=>{ const chance=Math.sin(t*.47+f.phase)*.5+Math.sin(t*1.73+f.phase*2)*.3; const off=chance>.775 && Math.sin(t*.23+f.phase)<-.1; f.light.intensity=off?f.base*.18:f.base*(.96+Math.sin(t*2+f.phase)*.018); f.mesh.material.emissiveIntensity=off?.8:3.2; }); renderer.render(scene,camera); }
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); }); animate();
</script>
</body>
</html>
